<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Βάπτιση του Μάξιμου</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="icon" href="./maximos.png" sizes="32x32">
    <link rel="icon" href="./maximos.png" sizes="192x192">
    <link rel="apple-touch-icon" href="./maximos.png">

    <link rel="stylesheet" href="./style.css">
</head>

<body>
<div class="glow" aria-hidden="true"></div>

<div class="page">
    <div class="card">
        <div class="corner-glow" aria-hidden="true"></div>

        <div class="badge">✨ Σας προσκαλούμε στη βάπτιση του γιού μας</div>

        <div class="cloud-wrap">
            <img src="./maximos-cloud.png" class="cloud-image" alt="Μάξιμος">
        </div>

        <div class="date">Τρίτη, 14 Απριλίου 2026</div>
        <a class="add-calendar" href="./baptism.ics" download>📅 Προσθήκη στο ημερολόγιο</a>

        <div class="countdown" id="countdown">
            <div class="cd-item">
                <div class="cd-num" id="cdDays">—</div>
                <div class="cd-label">Ημέρες</div>
            </div>
            <div class="cd-item">
                <div class="cd-num" id="cdHours">—</div>
                <div class="cd-label">Ώρες</div>
            </div>
            <div class="cd-item">
                <div class="cd-num" id="cdMins">—</div>
                <div class="cd-label">Λεπτά</div>
            </div>
            <div class="cd-item">
                <div class="cd-num" id="cdSecs">—</div>
                <div class="cd-label">Δευτ.</div>
            </div>
        </div>

        <div class="section-title">Τοποθεσίες</div>
        <div class="buttons">
            <a class="button" href="https://maps.app.goo.gl/2nZaq9yBSdZrj2Ww6" target="_blank" rel="noopener">
                ⛪ Εκκλησία Αγίας Μαρίνας
            </a>

            <a class="button" href="https://maps.app.goo.gl/dEHMkFHMWZMkRsGK6" target="_blank" rel="noopener">
                🪻 Levanda Event House
            </a>
        </div>

        <div class="section-title">Φωτογραφίες</div>
        <div class="buttons">
            <a class="button" href="#"
               onclick="alert('Οι φωτογραφίες θα είναι διαθέσιμες εδώ μετά τη βάπτιση 💙'); return false;">
                📸 Προβολή φωτογραφιών (μετά την ημέρα)
            </a>
        </div>

        <div class="footer">
            Θα χαρούμε πολύ να σας δούμε 🪻
        </div>
    </div>
</div>


<script src="./main.js"></script>
</body>
</html>
